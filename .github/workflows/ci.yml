name: CI

# ponytail: Phase 3 — CI pipeline that runs on every push/PR.
# Closes the "tests are never run automatically" gap flagged in audit.
# Three parallel jobs: lint/typecheck (frontend), test (backend), build (frontend bundle).
# All must pass before merge to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Backend: PHP + Composer + Pest tests
  # ─────────────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          extensions: mbstring, pdo, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL, display_errors=On

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
          # ponytail: run seeder so tests have org/team/user data
          php artisan db:seed --force || true

      - name: Run tests (Pest)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test --coverage --min=40 --coverage-text

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

  # ─────────────────────────────────────────────────────────────────────
  # Frontend: Node + npm + TypeScript check + Vite build
  # ─────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build frontend (Vite + SSR)
        run: npm run build

      - name: Check bundle size (warning threshold)
        run: |
          # ponytail: warn if build output exceeds 500KB gzipped
          BUILD_SIZE=$(du -sh public/build | awk '{print $1}')
          echo "Build size: $BUILD_SIZE"
          if [ $(du -sb public/build | awk '{print $1}') -gt 524288000 ]; then
            echo "::warning::Bundle size > 500MB. Consider code splitting."
          fi
